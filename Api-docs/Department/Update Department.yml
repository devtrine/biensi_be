info:
  name: Update Department
  type: http
  seq: 4

http:
  method: PUT
  url: http://localhost:5000/api/v1/departments/{{id}}
  body:
    type: json
    data: |-
      {
        "name" : "Database Enginner"
      }
  auth: inherit

runtime:
  variables:
    - name: id
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
