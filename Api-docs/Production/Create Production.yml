info:
  name: Create or Upsert Production
  type: http
  seq: 4

http:
  method: POST
  url: http://localhost:5000/api/v1/production
  body:
    type: json
    data: |-
      {
        "month": "Januari",
        "year": 2026,
        "productionQty": 42500,
        "notes": "Realisasi produksi bulan Januari 2026"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
