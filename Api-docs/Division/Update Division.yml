info:
  name: Update Division
  type: http
  seq: 4

http:
  method: PUT
  url: http://localhost:5000/api/v1/divisions/{{id}}
  auth: inherit

runtime:
  variables:
    - name: id
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
