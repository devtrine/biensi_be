info:
  name: Create Position
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:5000/api/v1/positions
  body:
    type: json
    data: |-
      {
        "code" : "POS-005",
        "name" : "Follow Up",
        "employeeLevel" : "staff"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
