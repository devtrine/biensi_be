info:
  name: Generate Snapshots Monthly
  type: http
  seq: 10

http:
  method: POST
  url: http://localhost:5000/api/v1/reporting-monthly/{{periodId}}/snapshots/generate
  auth: inherit

runtime:
  variables:
    - name: periodId
      value: 3799ef14-347b-4677-a881-44f768f33737

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
