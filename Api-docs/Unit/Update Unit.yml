info:
  name: Update Unit
  type: http
  seq: 4

http:
  method: PUT
  url: http://localhost:5000/api/v1/units/{{id}}
  body:
    type: json
    data: |-
      {
        "code" : "UNIT-CPO"
      }
  auth: inherit

runtime:
  variables:
    - name: id
      value: "3"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
